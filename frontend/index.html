<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopLab — QA Automation Practice Store</title>
<style>
  :root{
    --ink:#1b1f24; --muted:#5f6b76; --line:#e3e6ea; --bg:#f3f4f6; --card:#fff;
    --head:#14202b; --head2:#1f3040; --accent:#f2a93b; --accent-d:#d98f1f;
    --brand:#0f8b8d; --brand-d:#0b6e70; --danger:#c62828; --ok:#2e7d32;
    --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
  h1{font-size:26px;margin:0 0 16px} h2{font-size:19px;margin:0 0 12px} h3{font-size:15px;margin:18px 0 8px}
  .hidden{display:none!important}
  .muted{color:var(--muted)}

  /* header */
  .topbar{background:var(--head);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 20px;position:sticky;top:0;z-index:20}
  .logo{color:#fff;font-weight:800;font-size:24px;letter-spacing:-.5px;white-space:nowrap}
  .logo span{color:var(--accent)} .logo:hover{text-decoration:none}
  .search{flex:1;display:flex;border-radius:8px;overflow:hidden;max-width:820px}
  .search select{border:0;background:#e9ecef;padding:0 10px;font-size:13px;max-width:150px}
  .search input{flex:1;border:0;padding:10px 12px;font-size:15px;min-width:0}
  .search button{border:0;background:var(--accent);padding:0 16px;cursor:pointer;font-size:17px}
  .search button:hover{background:var(--accent-d)}
  .nav{display:flex;align-items:center;gap:16px;white-space:nowrap}
  .nav a,.nav .linkbtn{color:#fff;font-size:14px}
  .cart-link{font-weight:700;position:relative;font-size:16px!important}
  .badge{background:var(--accent);color:var(--head);border-radius:20px;padding:1px 7px;font-size:12px;font-weight:800;margin-left:2px}
  .subbar{background:var(--head2);padding:7px 20px;display:flex;gap:18px;overflow-x:auto}
  .subbar a{color:#dfe7ee;font-size:13.5px;white-space:nowrap}

  main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:22px 20px 40px}

  /* buttons & forms */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent-d);background:var(--accent);color:#1b1f24;font-weight:600;border-radius:20px;padding:8px 16px;cursor:pointer;font-size:14px}
  .btn:hover{background:var(--accent-d)}
  .btn:disabled{background:#e6e6e6;border-color:#ccc;color:#888;cursor:not-allowed}
  .btn-secondary{background:#fff;border-color:#c9ced4} .btn-secondary:hover{background:#f2f4f6}
  .btn-brand{background:var(--brand);border-color:var(--brand-d);color:#fff} .btn-brand:hover{background:var(--brand-d)}
  .btn-danger{background:var(--danger);border-color:#a51f1f;color:#fff} .btn-danger:hover{background:#a51f1f}
  .btn-block{width:100%} .btn-small{padding:5px 12px;font-size:13px}
  .linkbtn{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font:inherit}
  .linkbtn:hover{text-decoration:underline}
  label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 4px}
  input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid #b9c0c7;border-radius:7px;font:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,139,141,.35);border-color:var(--brand)}
  .invalid{border-color:var(--danger)!important;background:#fff8f8!important}
  .field-error{color:var(--danger);font-size:13px;min-height:0;margin-top:3px}
  .field-error:empty{display:none}
  .alert{border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:14px}
  .alert.error{background:#fdecea;border:1px solid #f5c2c0;color:#8a1c1c}
  .alert.info{background:#e8f4f4;border:1px solid #bfe0e0}
  .check,.radio{display:flex;align-items:center;gap:8px;font-weight:500;margin:8px 0;cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}

  /* spinner */
  .spinner{width:42px;height:42px;border:4px solid #d9dee3;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;grid-column:1/-1}
  .spin-sm{width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#1b1f24;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* catalog */
  .catalog{display:grid;grid-template-columns:230px 1fr;gap:22px}
  .filters{background:var(--card);border-radius:var(--radius);padding:6px 18px 18px;box-shadow:var(--shadow);align-self:start}
  .filters ul{list-style:none;margin:0;padding:0}
  .filters li{margin:5px 0}
  .filters a{color:var(--ink);font-size:14px} .filters a.active{font-weight:800;color:var(--brand)}
  .price-form{display:flex;gap:6px} .price-form input{padding:6px 8px}
  .results-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .results-bar label{display:flex;align-items:center;gap:8px;margin:0;font-weight:500}
  .results-bar select{width:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
  .thumb{display:flex;align-items:center;justify-content:center;height:150px;border-radius:8px;font-size:64px;margin-bottom:4px}
  .thumb:hover{text-decoration:none;filter:brightness(.97)}
  .card .title{color:var(--ink);font-weight:600;line-height:1.3;min-height:40px}
  .stars{color:#e8a317;letter-spacing:1px}
  .price{font-size:21px;font-weight:700}
  .card .btn{margin-top:auto}
  .stock-low{color:#b25e00;font-size:13px;font-weight:600}
  .wish{position:absolute;top:20px;right:20px;border:0;background:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:17px;box-shadow:var(--shadow);color:#c2185b}
  .pager{display:flex;justify-content:center;gap:6px;margin-top:22px}
  .pager button{min-width:36px;height:36px;border:1px solid #c9ced4;background:#fff;border-radius:7px;cursor:pointer}
  .pager button.active{background:var(--head);color:#fff;border-color:var(--head)}
  .pager button:disabled{opacity:.45;cursor:not-allowed}
  .empty{text-align:center;padding:50px 20px;grid-column:1/-1}
  .empty .big{font-size:54px}

  /* product page */
  .crumbs{font-size:13px;margin-bottom:14px;color:var(--muted)}
  .product{display:grid;grid-template-columns:1.1fr 1.3fr .9fr;gap:26px;align-items:start}
  .product .image{height:380px;font-size:150px;border-radius:var(--radius)}
  .product h1{font-size:24px;margin-bottom:6px}
  .buybox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px}
  .in-stock{color:var(--ok);font-weight:700} .out-stock{color:var(--danger);font-weight:700}
  .tabs{margin-top:30px}
  .tablist{display:flex;gap:4px;border-bottom:2px solid var(--line)}
  .tablist button{border:0;background:none;padding:10px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tablist button.active{color:var(--ink);border-bottom-color:var(--accent)}
  .tabpanel{background:var(--card);padding:20px;border-radius:0 0 var(--radius) var(--radius)}
  .specs{border-collapse:collapse;width:100%;max-width:520px}
  .specs td{padding:8px 10px;border-bottom:1px solid var(--line)} .specs td:first-child{font-weight:600;width:40%;background:#fafbfc}
  .review{border-bottom:1px solid var(--line);padding:12px 0}
  .review:last-child{border:0}
  .review-form{max-width:520px;margin-top:18px}

  /* cart */
  .cart{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
  .cart-item{display:grid;grid-template-columns:100px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
  .cart-item .thumb{height:90px;font-size:44px;margin:0}
  .cart-item .controls{display:flex;align-items:center;gap:12px;margin-top:8px}
  .cart-item select{width:auto;padding:5px 8px}
  .line{display:flex;justify-content:space-between;margin:6px 0}
  .line.total{font-size:19px;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .discount{color:var(--ok)}
  .promo{display:flex;gap:6px;margin-top:12px}

  /* checkout */
  .checkout{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
  .checkout form .panel{margin-bottom:18px}
  .summary{position:sticky;top:120px}
  .summary .mini{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:6px 0}

  /* auth */
  .auth{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .auth-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;width:380px;max-width:100%}
  .auth-box .btn-block{margin-top:18px}
  .pw{display:flex;gap:8px;align-items:center}
  .test-users{background:var(--card);border-radius:var(--radius);padding:6px 20px 16px;width:380px;max-width:100%;border:1px dashed #b9c0c7;font-size:13.5px}
  .test-users table{border-collapse:collapse;width:100%}
  .test-users td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  code{background:#eef1f4;padding:1px 5px;border-radius:4px;font-size:12.5px}

  /* orders */
  .order{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .order-head{background:#f0f2f2;padding:12px 18px;display:flex;gap:28px;flex-wrap:wrap;font-size:13px;align-items:center}
  .order-head b{display:block;font-size:14px}
  .order-body{padding:14px 18px}
  .status{padding:3px 10px;border-radius:20px;font-weight:700;font-size:12.5px}
  .status.processing{background:#fff3cd;color:#7a5a00} .status.cancelled{background:#fdecea;color:#8a1c1c}
  .confirm-box{max-width:640px;margin:0 auto;text-align:center}
  .confirm-box .big{font-size:60px}

  /* toast & modal */
  #toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:var(--head);color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);border-left:5px solid var(--ok);animation:pop .2s ease-out;max-width:340px}
  .toast.error{border-left-color:#ff6b6b}
  @keyframes pop{from{transform:translateY(10px);opacity:0}}
  .modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-box{background:#fff;border-radius:12px;padding:24px;width:380px;max-width:92vw}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

  footer{background:var(--head);color:#c7d1da;text-align:center;padding:22px;font-size:13px}
  footer .linkbtn{color:var(--accent)}

  @media (max-width:900px){
    .catalog,.cart,.checkout,.product{grid-template-columns:1fr}
    .topbar{flex-wrap:wrap} .search{order:3;flex-basis:100%}
    .summary{position:static}
  }
</style>
</head>
<body>

<header class="topbar" data-testid="header">
  <a href="#/" class="logo" data-testid="logo">shop<span>lab</span></a>
  <form class="search" id="searchForm" data-testid="search-form" role="search">
    <select id="searchCategory" data-testid="search-category" aria-label="Search category"></select>
    <input id="searchInput" type="search" placeholder="Search ShopLab" autocomplete="off" data-testid="search-input" aria-label="Search">
    <button type="submit" id="searchButton" data-testid="search-button" aria-label="Search">🔍</button>
  </form>
  <nav class="nav" data-testid="nav">
    <span id="account" data-testid="account"></span>
    <a href="#/orders" data-testid="orders-link">Orders</a>
    <a href="#/wishlist" data-testid="wishlist-link">♡ Wishlist <span class="badge" id="wishCount" data-testid="wishlist-count">0</span></a>
    <a href="#/cart" class="cart-link" data-testid="cart-link">🛒 Cart <span class="badge" id="cartCount" data-testid="cart-count">0</span></a>
  </nav>
</header>
<div class="subbar" id="subbar" data-testid="category-bar"></div>

<main id="app" data-testid="page-content"></main>

<div id="toasts" data-testid="toast-container" aria-live="polite"></div>

<div id="modal" class="modal hidden" data-testid="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h2 id="modalTitle" data-testid="modal-title">Are you sure?</h2>
    <p id="modalText" data-testid="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCancel" data-testid="modal-cancel">Cancel</button>
      <button class="btn btn-danger" id="modalOk" data-testid="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<footer data-testid="footer">
  ShopLab is a demo store for practising test automation. No real orders, payments or products.
  &nbsp;·&nbsp; <button class="linkbtn" data-action="reset-data" data-testid="reset-data">Reset store data</button>
</footer>

<!-- Where the API lives. Edit config.js (not this file) to point the site at another backend. -->
<script src="config.js"></script>
<script>
/* =========================================================
   CONFIG
   Products, users, cart and orders come from the backend REST API.
   Only the wishlist, reviews, a guest's cart and the login token stay in localStorage.
   ========================================================= */
const API_URL = (window.SHOPLAB_CONFIG && window.SHOPLAB_CONFIG.apiUrl) || 'http://localhost:8080';

const PAGE_SIZE = 8;
const MAX_QTY = 10;                  // max pieces of one product per order (the backend enforces it too)
const FREE_SHIPPING_FROM = 50;       // only for the "FREE delivery" text on the product page
const COUNTRIES = ['United States','Canada','United Kingdom','Germany','Italy','Spain','France','Poland'];
const SEED_REVIEWS = [
  {author:'Alex M.',  rating:5, text:'Exactly as described. Fast delivery, would buy again.'},
  {author:'Jordan K.',rating:4, text:'Good value for the money. Packaging could be better.'},
  {author:'Sam R.',   rating:3, text:'Does the job, but nothing special.'}
];

/* Minimum durations, kept from the original site so tests can practise explicit waits. */
const DELAY = {catalog: 600, login: 400, order: 1500};

/* =========================================================
   STATE
   ========================================================= */
const KEY = 'shoplab_';
function load(k, d){ try{ const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(KEY + k, JSON.stringify(v)); } catch(e){} }
const S = {
  // saved in localStorage (see persist)
  token: load('token', null),          // login token from the API
  guestCart: load('guestCart', []),    // [{id, qty}] — cart of a visitor who is not logged in
  guestPromo: load('guestPromo', null),
  wishlist: load('wishlist', []),
  reviews: load('reviews', {}),
  // only in memory
  user: null,                          // {id, email, name} from GET /api/users/me
  products: [],                        // all products, for the wishlist and guest cart
  categories: [],
  cartView: null                       // last cart received from the API (logged-in user)
};
function persist(){ ['token', 'guestCart', 'guestPromo', 'wishlist', 'reviews'].forEach(k => save(k, S[k])); }

/* =========================================================
   API CLIENT
   One function for every request to the backend.
   ========================================================= */
class ApiError extends Error {
  constructor(status, body){
    super((body && body.message) || `Request failed (HTTP ${status})`);
    this.status = status;                                  // HTTP status, 0 = server not reachable
    this.fieldErrors = (body && body.fieldErrors) || {};   // {"shippingAddress.zip": "ZIP code must be 5 digits"}
    this.handled = false;                                  // true = the user was already told about it
  }
}

async function api(method, path, body, {redirectOn401 = true} = {}){
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;

  let res;
  try {
    res = await fetch(API_URL + path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
  } catch (networkError){
    // fetch only throws when there is no answer at all: backend down, wrong URL, CORS blocked
    throw new ApiError(0, {message: `Cannot connect to the ShopLab API (${API_URL}). Is the backend running?`});
  }

  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.ok) return data;

  const error = new ApiError(res.status, data);
  // Token no longer valid (logged out elsewhere, database reset...): log out locally.
  if (res.status === 401 && S.token && redirectOn401 && !path.startsWith('/api/auth/')){
    clearSession();
    toast('Your session has expired. Please sign in again.', 'error');
    navigate('#/login?redirect=' + encodeURIComponent(location.hash.replace(/^#\/?/, '')));
    error.handled = true;
  }
  throw error;
}

/** Shows an error as a toast (unless the user was already told). */
function showError(e){
  if (!e.handled) toast(e.message || 'Something went wrong', 'error');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
/** Waits for the promise, but at least `ms` milliseconds (also when it fails). */
async function withMinDelay(promise, ms){
  const [result] = await Promise.allSettled([promise, sleep(ms)]);
  if (result.status === 'fulfilled') return result.value;
  throw result.reason;
}

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + Number(n).toFixed(2);           // the API sends prices in dollars, e.g. 39.99
const byId = id => S.products.find(p => p.id === Number(id));
const stars = r => '★'.repeat(Math.round(r)) + '☆'.repeat(5 - Math.round(r));
const kebab = s => s.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const currentUser = () => S.user;
const statusLabel = s => s.charAt(0) + s.slice(1).toLowerCase();   // PROCESSING -> Processing
const LOADING = '<div class="spinner" data-testid="loading-spinner"></div>';

function navigate(hash){ if (location.hash === hash) router(); else location.hash = hash; }

function toast(msg, type = 'success'){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.setAttribute('data-testid', 'toast');
  t.setAttribute('role', 'status');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function confirmModal(text, {title = 'Are you sure?', ok = 'Confirm'} = {}){
  return new Promise(resolve => {
    const m = $('#modal');
    $('#modalTitle').textContent = title;
    $('#modalText').textContent = text;
    $('#modalOk').textContent = ok;
    m.classList.remove('hidden');
    const done = v => { m.classList.add('hidden'); $('#modalOk').onclick = $('#modalCancel').onclick = null; resolve(v); };
    $('#modalOk').onclick = () => done(true);
    $('#modalCancel').onclick = () => done(false);
  });
}

function setError(id, msg){
  const input = document.getElementById(id), err = document.getElementById(id + 'Error');
  if (input) input.classList.add('invalid');
  if (err) err.textContent = msg;
}
function clearErrors(form){
  $$('.invalid', form).forEach(el => el.classList.remove('invalid'));
  $$('.field-error', form).forEach(el => el.textContent = '');
}
/** Puts the API's fieldErrors under the matching inputs. fieldMap: API field name -> input id. */
function showFieldErrors(e, fieldMap){
  let shown = 0;
  Object.entries(e.fieldErrors).forEach(([field, msg]) => {
    if (fieldMap[field]){ setError(fieldMap[field], msg); shown++; }
  });
  return shown;
}
function field(id, label, type = 'text', value = '', placeholder = ''){
  return `<label for="${id}">${label}</label>
    <input id="${id}" name="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" data-testid="${kebab(id)}-input">
    <div class="field-error" id="${id}Error" data-testid="${kebab(id)}-error"></div>`;
}
function errorBox(e){
  return `<div class="alert error" data-testid="api-error" role="alert">${esc(e.message)}</div>`;
}

/* =========================================================
   DATA LOADING
   ========================================================= */
async function loadProducts(){
  const page = await api('GET', '/api/products?size=100');
  S.products = page.items;
}
async function loadCategories(){
  S.categories = await api('GET', '/api/categories');
}

/* =========================================================
   SESSION (login token)
   ========================================================= */
function clearSession(){
  S.token = null; S.user = null; S.cartView = null;
  persist(); updateHeader();
}

/** After login or registration: remember the token and move the guest cart to the account. */
async function startSession(auth){
  S.token = auth.token; S.user = auth.user;
  persist();
  const failed = [];
  for (const it of S.guestCart){
    try { await api('POST', '/api/cart/items', {productId: it.id, quantity: it.qty}); }
    catch (e){ failed.push(`${(byId(it.id) || {}).title || 'Product ' + it.id}: ${e.message}`); }
  }
  if (S.guestPromo){ try { await api('POST', '/api/cart/promo', {code: S.guestPromo}); } catch (e){ /* ignore */ } }
  S.guestCart = []; S.guestPromo = null; persist();
  if (failed.length) toast('Some items could not be moved to your cart. ' + failed.join('; '), 'error');
  await refreshCart();
}

/* =========================================================
   CART
   Logged-in user: the cart is stored on the server (/api/cart).
   Guest: the cart is stored in localStorage; prices and totals still come from the server
   (POST /api/cart/preview), so all money rules live in ONE place: the backend.
   ========================================================= */
const EMPTY_CART = {items: [], itemCount: 0, promoCode: null, promoDescription: null,
  subtotal: 0, discount: 0, shipping: 0, total: 0, amountToFreeShipping: FREE_SHIPPING_FROM};

async function refreshCart(){
  S.cartView = currentUser() ? await api('GET', '/api/cart') : null;
  updateHeader();
}

async function loadCartView(delivery = 'standard'){
  if (currentUser()){
    S.cartView = await api('GET', '/api/cart?deliveryMethod=' + delivery);
    return S.cartView;
  }
  if (!S.guestCart.length) return EMPTY_CART;
  return api('POST', '/api/cart/preview', {
    items: S.guestCart.map(it => ({productId: it.id, quantity: it.qty})),
    promoCode: S.guestPromo, deliveryMethod: delivery
  });
}

function cartCount(){
  return currentUser()
    ? (S.cartView ? S.cartView.itemCount : 0)
    : S.guestCart.reduce((n, it) => n + it.qty, 0);
}

async function addToCart(id, qty = 1){
  const p = byId(id);
  try {
    if (currentUser()){
      S.cartView = await api('POST', '/api/cart/items', {productId: id, quantity: qty});   // the server checks stock
    } else {
      // Guest: check in the browser (instant feedback). The server checks again at checkout.
      if (!p || p.stock === 0){ toast('This item is out of stock', 'error'); return false; }
      const item = S.guestCart.find(i => i.id === p.id);
      const have = item ? item.qty : 0;
      if (have + qty > p.stock){ toast(`Only ${p.stock} item(s) available in stock`, 'error'); return false; }
      if (have + qty > MAX_QTY){ toast(`You can buy at most ${MAX_QTY} of the same item`, 'error'); return false; }
      if (item) item.qty += qty; else S.guestCart.push({id: p.id, qty});
      persist();
    }
  } catch (e){ showError(e); return false; }
  updateHeader();
  toast(`Added to cart: ${p ? p.title : 'product'}`);
  return true;
}

async function setQuantity(id, qty){
  if (currentUser()) S.cartView = await api('PUT', '/api/cart/items/' + id, {quantity: qty});
  else { const it = S.guestCart.find(i => i.id === id); if (it){ it.qty = qty; persist(); } }
}
async function removeFromCart(id){
  if (currentUser()) S.cartView = await api('DELETE', '/api/cart/items/' + id);
  else { S.guestCart = S.guestCart.filter(i => i.id !== id); persist(); }
}
async function clearCart(){
  if (currentUser()) S.cartView = await api('DELETE', '/api/cart');
  else { S.guestCart = []; S.guestPromo = null; persist(); }
}
async function applyPromo(code){
  if (currentUser()){ S.cartView = await api('POST', '/api/cart/promo', {code}); return; }
  // Guest: ask the server whether the code is valid (it answers 400 if not)
  const preview = await api('POST', '/api/cart/preview', {
    items: S.guestCart.map(it => ({productId: it.id, quantity: it.qty})), promoCode: code});
  S.guestPromo = preview.promoCode; persist();
}
async function removePromo(){
  if (currentUser()) S.cartView = await api('DELETE', '/api/cart/promo');
  else { S.guestPromo = null; persist(); }
}

function toggleWish(id){
  const i = S.wishlist.indexOf(id);
  if (i >= 0){ S.wishlist.splice(i, 1); toast('Removed from wishlist'); }
  else { S.wishlist.push(id); toast('Added to wishlist'); }
  persist(); updateHeader();
  const on = S.wishlist.includes(id);
  $$(`[data-action="toggle-wish"][data-id="${id}"]`).forEach(b => {
    b.classList.toggle('on', on);
    b.textContent = b.dataset.label ? (on ? '♥ In wishlist' : '♡ Add to wishlist') : (on ? '♥' : '♡');
  });
}

  $('#account').innerHTML = u
    ? `<span data-testid="greeting">Hello, ${esc(u.name.split(' ')[0])}</span> &nbsp;<button class="linkbtn" data-action="logout" data-testid="logout-button">Sign out</button>`

}

/* =========================================================
   ROUTER
   ========================================================= */
let renderToken = 0;   // grows on every page change; an async page checks it before drawing
const isCurrent = token => token === renderToken;

function parseHash(){
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  return {parts: path.split('/').filter(Boolean), params: new URLSearchParams(qs || '')};
}
function router(){
  const {parts, params} = parseHash();
  window.scrollTo(0, 0);
  renderToken++;
  const route = parts[0] || '';
  document.body.dataset.page = route || 'home';
  app.innerHTML = LOADING;   // pages that load data show a spinner until it arrives
  switch (route){
    case '': case 'search': renderCatalog(params); break;
    case 'product':  renderProduct(parts[1]); break;
    case 'cart':     renderCart(); break;
    case 'login':    renderLogin(params); break;
    case 'register': renderRegister(params); break;
    case 'checkout': if (requireAuth('checkout')) renderCheckout(); break;
    case 'order':    if (requireAuth('orders')) renderOrderConfirmation(parts[1]); break;
    case 'orders':   if (requireAuth('orders')) renderOrders(); break;
    case 'wishlist': renderWishlist(); break;
    default:         renderNotFound();
  }
  updateHeader();
}
function requireAuth(redirect){
  if (currentUser()) return true;
  toast('Please sign in to continue', 'error');
  navigate('#/login?redirect=' + encodeURIComponent(redirect));
  return false;
}

/* =========================================================
   CATALOG
   ========================================================= */
function hashWith(params, updates){
  const p = new URLSearchParams(params);
  Object.entries(updates).forEach(([k, v]) => (v === '' || v == null) ? p.delete(k) : p.set(k, v));
  if (!('page' in updates)) p.delete('page');
  const s = p.toString();
  return '#/search' + (s ? '?' + s : '');
}
/** Translates the site's URL parameters (#/search?cat=Books&min=10) into API parameters. */
function apiSearchParams(params, page){
  const q = new URLSearchParams({size: PAGE_SIZE});
  const num = name => { const v = parseFloat(params.get(name)); return isNaN(v) ? null : v; };
  if ((params.get('q') || '').trim()) q.set('q', params.get('q').trim());
  if (params.get('cat')) q.set('category', params.get('cat'));
  if (num('min') !== null) q.set('minPrice', num('min'));
  if (num('max') !== null) q.set('maxPrice', num('max'));
  if (num('rating') !== null) q.set('minRating', num('rating'));
  if (params.get('stock') === '1') q.set('inStock', 'true');
  if (params.get('sort') && params.get('sort') !== 'featured') q.set('sort', params.get('sort'));
  q.set('page', page);
  return q.toString();
}
function productCard(p){
  const on = S.wishlist.includes(p.id);
  return `<article class="card" data-testid="product-card" data-product-id="${p.id}">
    <button class="wish ${on ? 'on' : ''}" data-action="toggle-wish" data-id="${p.id}" data-testid="wishlist-toggle" aria-label="Toggle wishlist">${on ? '♥' : '♡'}</button>
    <a href="#/product/${p.id}" class="thumb" style="background:${p.color}" data-testid="product-image" aria-label="${esc(p.title)}">${p.emoji}</a>
    <a href="#/product/${p.id}" class="title" data-testid="product-title">${esc(p.title)}</a>
    <div data-testid="product-rating" data-rating="${p.rating}"><span class="stars">${stars(p.rating)}</span> <span class="muted">(${p.reviewsCount.toLocaleString('en-US')})</span></div>
    <div class="price" data-testid="product-price">${usd(p.price)}</div>
    ${p.stock > 0 && p.stock <= 3 ? `<div class="stock-low" data-testid="low-stock">Only ${p.stock} left in stock</div>` : ''}
    ${p.stock > 0
      ? `<button class="btn" id="add-to-cart-${p.id}" data-action="add" data-id="${p.id}" data-testid="add-to-cart">Add to cart</button>`
      : `<button class="btn" id="add-to-cart-${p.id}" disabled data-testid="add-to-cart">Out of stock</button>`}
  </article>`;
}
async function renderCatalog(params){
  const token = renderToken;
  const q = params.get('q') || '', cat = params.get('cat') || '', rating = params.get('rating') || '', sort = params.get('sort') || 'featured';
  $('#searchInput').value = q;
  $('#searchCategory').value = cat;
  app.innerHTML = `
  <div class="catalog">
    <aside class="filters" data-testid="filters">
      <h3>Department</h3>
      <ul>${['', ...S.categories].map(c => `<li><a href="${hashWith(params, {cat: c})}" class="${c === cat ? 'active' : ''}" data-testid="filter-category-${(c || 'all').toLowerCase()}">${esc(c || 'All departments')}</a></li>`).join('')}</ul>
      <h3>Customer rating</h3>
      <ul>${['4', '3', '2'].map(r => `<li><a href="${hashWith(params, {rating: r})}" class="${r === rating ? 'active' : ''}" data-testid="filter-rating-${r}"><span class="stars">${stars(+r)}</span> &amp; up</a></li>`).join('')}
        <li><a href="${hashWith(params, {rating: ''})}" class="${!rating ? 'active' : ''}" data-testid="filter-rating-any">Any rating</a></li></ul>
      <h3>Price, $</h3>
      <form id="priceForm" class="price-form" data-testid="price-filter" novalidate>
        <input type="number" id="minPrice" placeholder="Min" value="${esc(params.get('min') || '')}" data-testid="min-price" aria-label="Minimum price">
        <input type="number" id="maxPrice" placeholder="Max" value="${esc(params.get('max') || '')}" data-testid="max-price" aria-label="Maximum price">
        <button class="btn btn-small" data-testid="apply-price">Go</button>
      </form>
      <div class="field-error" id="priceError" data-testid="price-error"></div>
      <h3>Availability</h3>
      <label class="check"><input type="checkbox" id="inStock" ${params.get('stock') === '1' ? 'checked' : ''} data-testid="filter-in-stock"> In stock only</label>
      <h3></h3>
      <button class="linkbtn" data-action="clear-filters" data-testid="clear-filters">Clear all filters</button>
    </aside>
    <section>
      <div class="results-bar">
        <div id="resultsSummary" data-testid="results-summary">Loading…</div>
        <label>Sort by:
          <select id="sortSelect" data-testid="sort-select">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Avg. Customer Review</option>
            <option value="name">Name: A to Z</option>
          </select>
        </label>
      </div>
      <div id="grid" class="grid" data-testid="product-grid">${LOADING}</div>
      <div id="pager" class="pager" data-testid="pagination"></div>
    </section>
  </div>`;
  $('#sortSelect').value = sort;
  $('#sortSelect').addEventListener('change', e => navigate(hashWith(params, {sort: e.target.value === 'featured' ? '' : e.target.value})));
  $('#inStock').addEventListener('change', e => navigate(hashWith(params, {stock: e.target.checked ? '1' : ''})));
  $('#priceForm').addEventListener('submit', e => {
    e.preventDefault();
    const min = $('#minPrice').value.trim(), max = $('#maxPrice').value.trim();
    $('#priceError').textContent = '';
    if ((min && +min < 0) || (max && +max < 0)) { $('#priceError').textContent = 'Price cannot be negative'; return; }
    if (min && max && +min > +max) { $('#priceError').textContent = 'Min price must be less than max price'; return; }
    navigate(hashWith(params, {min, max}));
  });

  const requested = Math.max(1, parseInt(params.get('page')) || 1);
  let data;
  try {
    data = await withMinDelay(api('GET', '/api/products?' + apiSearchParams(params, requested)), DELAY.catalog);
    // Page number too big (e.g. ?page=99)? Show the last page instead, like before.
    if (!data.items.length && data.totalPages > 0){
      data = await api('GET', '/api/products?' + apiSearchParams(params, data.totalPages));
    }
  } catch (e){
    if (!isCurrent(token)) return;
    $('#resultsSummary').innerHTML = `<b data-testid="results-count">0</b> results`;
    $('#grid').innerHTML = errorBox(e);
    if (e.status === 400) $('#priceError').textContent = e.message;   // e.g. a negative price typed into the URL
    return;
  }
  if (!isCurrent(token)) return;   // the user already went to another page

  const page = data.page, pages = data.totalPages, total = data.totalItems;
  const from = total ? (page - 1) * PAGE_SIZE + 1 : 0, to = (page - 1) * PAGE_SIZE + data.items.length;
  $('#resultsSummary').innerHTML = total
    ? `<span data-testid="results-range">${from}-${to}</span> of <b data-testid="results-count">${total}</b> results${q ? ` for <b data-testid="search-term">"${esc(q)}"</b>` : ''}${cat ? ` in <b>${esc(cat)}</b>` : ''}`
    : `<b data-testid="results-count">0</b> results`;
  $('#grid').innerHTML = data.items.length ? data.items.map(productCard).join('') : `
    <div class="empty" data-testid="no-results"><div class="big">🔎</div>
      <h2>No results found${q ? ` for "${esc(q)}"` : ''}</h2>
      <p class="muted">Try checking your spelling or using more general terms.</p></div>`;
  $('#pager').innerHTML = pages > 1 ? `
    <button data-page="${page - 1}" ${page === 1 ? 'disabled' : ''} data-testid="page-prev">‹ Prev</button>
    ${Array.from({length: pages}, (_, i) => `<button data-page="${i + 1}" class="${i + 1 === page ? 'active' : ''}" data-testid="page-${i + 1}" ${i + 1 === page ? 'aria-current="page"' : ''}>${i + 1}</button>`).join('')}
    <button data-page="${page + 1}" ${page === pages ? 'disabled' : ''} data-testid="page-next">Next ›</button>` : '';
  $$('#pager button').forEach(b => b.addEventListener('click', () => navigate(hashWith(params, {page: b.dataset.page}))));
}

/* =========================================================
   PRODUCT PAGE
   ========================================================= */
function reviewsFor(id){ return [...(S.reviews[id] || []), ...SEED_REVIEWS]; }
function reviewsHtml(id){
  return reviewsFor(id).map(r => `<div class="review" data-testid="review">
      <b data-testid="review-author">${esc(r.author)}</b> <span class="stars" data-testid="review-rating" data-rating="${r.rating}">${stars(r.rating)}</span>
      <div data-testid="review-text">${esc(r.text)}</div></div>`).join('');
}
async function renderProduct(id){
  const token = renderToken;
  if (!/^\d+$/.test(id || '')) return renderNotFound();
  let p;
  try { p = await api('GET', '/api/products/' + id); }
  catch (e){
    if (!isCurrent(token)) return;
    return e.status === 404 ? renderNotFound() : (app.innerHTML = errorBox(e));
  }
  if (!isCurrent(token)) return;
  // keep the local copy fresh (used by the wishlist and the guest cart)
  S.products = S.products.map(x => x.id === p.id ? p : x);

  const u = currentUser(), on = S.wishlist.includes(p.id);
  const maxQty = Math.min(p.stock, MAX_QTY);
  app.innerHTML = `
  <div class="crumbs" data-testid="breadcrumbs"><a href="#/">Home</a> › <a href="#/search?cat=${encodeURIComponent(p.category)}" data-testid="breadcrumb-category">${esc(p.category)}</a> › <span>${esc(p.title)}</span></div>
  <div class="product" data-testid="product-details" data-product-id="${p.id}">
    <div class="thumb image" style="background:${p.color}" data-testid="product-image">${p.emoji}</div>
    <div>
      <h1 data-testid="product-name">${esc(p.title)}</h1>
      <div class="muted">Brand: <a href="#/search?q=${encodeURIComponent(p.brand)}" data-testid="product-brand">${esc(p.brand)}</a></div>
      <div style="margin:8px 0"><span class="stars">${stars(p.rating)}</span> <span data-testid="product-rating">${p.rating}</span> · <span class="muted" data-testid="product-reviews-count">${p.reviewsCount.toLocaleString('en-US')} ratings</span></div>
      <hr style="border:0;border-top:1px solid var(--line)">
      <div class="price" style="font-size:28px" data-testid="product-price">${usd(p.price)}</div>
      <p>${esc(p.description)}</p>
    </div>
    <div class="buybox" data-testid="buy-box">
      <div class="price" data-testid="buybox-price">${usd(p.price)}</div>
      <div class="muted" style="font-size:13.5px">${p.price >= FREE_SHIPPING_FROM ? 'FREE delivery' : 'Free delivery on orders over $50'}</div>
      ${p.stock > 0
        ? `<div class="in-stock" data-testid="stock-status">In stock${p.stock <= 3 ? ` — only ${p.stock} left` : ''}</div>
           <label for="qtySelect" style="margin:0">Quantity</label>
           <select id="qtySelect" data-testid="quantity-select">${Array.from({length: maxQty}, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('')}</select>
           <button class="btn btn-block" data-action="add-qty" data-id="${p.id}" data-testid="add-to-cart">Add to cart</button>
           <button class="btn btn-brand btn-block" data-action="buy-now" data-id="${p.id}" data-testid="buy-now">Buy now</button>`
        : `<div class="out-stock" data-testid="stock-status">Currently unavailable</div>
           <button class="btn btn-block" disabled data-testid="add-to-cart">Out of stock</button>`}
      <button class="btn btn-secondary btn-block ${on ? 'on' : ''}" data-action="toggle-wish" data-label="1" data-id="${p.id}" data-testid="wishlist-toggle">${on ? '♥ In wishlist' : '♡ Add to wishlist'}</button>
    </div>
  </div>
  <div class="tabs" data-testid="product-tabs">
    <div class="tablist" role="tablist">
      <button role="tab" class="active" data-action="tab" data-tab="desc" data-testid="tab-description">Description</button>
      <button role="tab" data-action="tab" data-tab="specs" data-testid="tab-specs">Specifications</button>
      <button role="tab" data-action="tab" data-tab="reviews" data-testid="tab-reviews">Reviews (<span id="reviewCount">${reviewsFor(p.id).length}</span>)</button>
    </div>
    <div class="tabpanel" id="tab-desc" data-testid="panel-description"><p>${esc(p.description)}</p><p>Product ID for automation: <code>${p.id}</code></p></div>
    <div class="tabpanel hidden" id="tab-specs" data-testid="panel-specs">
      <table class="specs" data-testid="specs-table">
        <tr><td>Brand</td><td>${esc(p.brand)}</td></tr><tr><td>Category</td><td>${esc(p.category)}</td></tr>
        <tr><td>SKU</td><td data-testid="product-sku">${esc(p.sku)}</td></tr><tr><td>In stock</td><td>${p.stock}</td></tr>
        <tr><td>Warranty</td><td>1 year</td></tr></table>
    </div>
    <div class="tabpanel hidden" id="tab-reviews" data-testid="panel-reviews">
      <div id="reviewList" data-testid="review-list">${reviewsHtml(p.id)}</div>
      <form class="review-form" id="reviewForm" novalidate data-testid="review-form">
        <h2>Write a review</h2>
        <div class="alert info hidden" id="reviewSuccess" data-testid="review-success">Thank you! Your review has been published.</div>
        ${field('reviewName', 'Your name', 'text', u ? u.name : '')}
        <label for="reviewRating">Rating</label>
        <select id="reviewRating" data-testid="review-rating-select"><option value="">Select…</option>${[5, 4, 3, 2, 1].map(n => `<option value="${n}">${n} star${n > 1 ? 's' : ''}</option>`).join('')}</select>
        <div class="field-error" id="reviewRatingError" data-testid="review-rating-error"></div>
        <label for="reviewText">Review</label>
        <textarea id="reviewText" rows="4" maxlength="500" data-testid="review-text-input"></textarea>
        <div class="field-error" id="reviewTextError" data-testid="review-text-error"></div>
        <button class="btn" style="margin-top:12px" data-testid="submit-review">Submit review</button>
      </form>
    </div>
  </div>`;
  $('#reviewForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target; clearErrors(f); $('#reviewSuccess').classList.add('hidden');
    const name = $('#reviewName').value.trim(), rating = $('#reviewRating').value, text = $('#reviewText').value.trim();
    let ok = true;
    if (!name){ setError('reviewName', 'Name is required'); ok = false; }
    if (!rating){ setError('reviewRating', 'Please select a rating'); ok = false; }
    if (text.length < 10){ setError('reviewText', 'Review must be at least 10 characters'); ok = false; }
    if (!ok) return;
    (S.reviews[p.id] = S.reviews[p.id] || []).unshift({author: name, rating: +rating, text});
    persist();
    $('#reviewList').innerHTML = reviewsHtml(p.id);
    $('#reviewCount').textContent = reviewsFor(p.id).length;
    f.reset(); if (u) $('#reviewName').value = u.name;
    $('#reviewSuccess').classList.remove('hidden');
  });
}

   CART PAGE

function summaryLines(c){
  return `
    <div class="line"><span>Items (<span data-testid="summary-count">${c.itemCount}</span>):</span><span data-testid="summary-subtotal">${usd(c.subtotal)}</span></div>
    ${Number(c.discount) ? `<div class="line discount"><span>Discount (${esc(c.promoCode)}):</span><span data-testid="summary-discount">-${usd(c.discount)}</span></div>` : ''}
    <div class="line"><span>Shipping:</span><span data-testid="summary-shipping">${Number(c.shipping) ? usd(c.shipping) : 'FREE'}</span></div>
    <div class="line total"><span>Order total:</span><span data-testid="summary-total">${usd(c.total)}</span></div>`;
}
async function renderCart(){
  const token = renderToken;
  let c;
  try { c = await loadCartView(); }
  catch (e){ if (isCurrent(token)) app.innerHTML = errorBox(e); return; }
  if (!isCurrent(token)) return;
  updateHeader();
  if (!c.items.length){
    app.innerHTML = `<div class="panel empty" data-testid="empty-cart"><div class="big">🛒</div>
      <h1>Your cart is empty</h1><p class="muted">Looks like you haven't added anything yet.</p>
      <a class="btn" href="#/" data-testid="continue-shopping">Continue shopping</a></div>`;
    return;
  }
  app.innerHTML = `
  <div class="cart">
    <div class="panel" data-testid="cart-items">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h1 style="margin:0">Shopping Cart</h1>
        <button class="linkbtn" data-action="clear-cart" data-testid="clear-cart">Remove all items</button>
      </div>
      ${c.items.map(it => `

/** API field name -> id of the checkout input that shows the error. */
const CHECKOUT_FIELDS = {
  'shippingAddress.fullName': 'fullName', 'shippingAddress.address': 'address', 'shippingAddress.city': 'city',
  'shippingAddress.zip': 'zip', 'shippingAddress.country': 'country', 'shippingAddress.phone': 'phone',

};

async function renderCheckout(){
  const token = renderToken;
  let c;
  try { c = await loadCartView('standard'); }
  catch (e){ if (isCurrent(token)) app.innerHTML = errorBox(e); return; }
  if (!isCurrent(token)) return;
  if (!c.items.length){ navigate('#/cart'); return; }
  const u = currentUser();
  app.innerHTML = `
  <h1>Checkout</h1>
  <div class="alert error hidden" id="checkoutError" data-testid="checkout-error" role="alert"></div>
  <div class="checkout">
    <form id="checkoutForm" novalidate data-testid="checkout-form">

        <h2>3. Payment</h2>
        <label class="radio"><input type="radio" name="payment" value="card" checked data-testid="payment-card"> Credit / debit card</label>
        <label class="radio"><input type="radio" name="payment" value="cod" data-testid="payment-cod"> Cash on delivery</label>
        <div id="cardFields" data-testid="card-fields">
          ${field('cardNumber', 'Card number', 'text', '', '4242 4242 4242 4242')}
          <div class="row2"><div>${field('expiry', 'Expiry date', 'text', '', 'MM/YY')}</div><div>${field('cvv', 'CVV', 'password', '', '123')}</div></div>
        </div>
      </section>
    </form>
    <aside class="panel summary" data-testid="order-summary">
      <h2>Order summary</h2>
      ${c.items.map(it => `<div class="mini" data-testid="summary-item"><span>${it.quantity} × ${esc(it.title)}</span><span>${usd(it.lineTotal)}</span></div>`).join('')}

      <button type="submit" form="checkoutForm" class="btn btn-block" id="placeOrder" style="margin-top:14px" data-testid="place-order">Place your order</button>
      <p class="muted" style="font-size:12px">By placing your order you agree to ShopLab's (fake) conditions of use.</p>
    </aside>
  </div>`;
  const form = $('#checkoutForm');
  const delivery = () => form.querySelector('[name=delivery]:checked').value;
  const payment = () => form.querySelector('[name=payment]:checked').value;
  form.addEventListener('change', async e => {
    if (e.target.name === 'payment') $('#cardFields').classList.toggle('hidden', payment() !== 'card');
    if (e.target.name === 'delivery'){
      // Shipping cost depends on the delivery method: ask the server for new totals.
      try { const t = await loadCartView(delivery()); if (isCurrent(token)) $('#checkoutTotals').innerHTML = summaryLines(t); }
      catch (err){ showError(err); }
    }
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    clearErrors(form);
    const err = $('#checkoutError'); err.classList.add('hidden');
    const v = id => $('#' + id).value.trim();
    let ok = true;
    if (v('fullName').length < 2){ setError('fullName', 'Please enter your full name'); ok = false; }
    if (!v('address')){ setError('address', 'Address is required'); ok = false; }
    if (!v('city')){ setError('city', 'City is required'); ok = false; }
    if (!v('zip')){ setError('zip', 'ZIP code is required'); ok = false; }
    else if (!/^\d{5}$/.test(v('zip'))){ setError('zip', 'ZIP code must be 5 digits'); ok = false; }
    if (!v('country')){ setError('country', 'Please select a country'); ok = false; }
    if (!v('phone')){ setError('phone', 'Phone number is required'); ok = false; }
    else if (!/^\+?[\d\s-]{7,15}$/.test(v('phone'))){ setError('phone', 'Enter a valid phone number'); ok = false; }
    const card = v('cardNumber').replace(/[\s-]/g, '');
    if (payment() === 'card'){
      if (!/^\d{16}$/.test(card)){ setError('cardNumber', 'Card number must be 16 digits'); ok = false; }
      const m = v('expiry').match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
      if (!m){ setError('expiry', 'Use the format MM/YY'); ok = false; }
      else { const now = new Date(); const exp = new Date(2000 + +m[2], +m[1], 1);
        if (exp <= now){ setError('expiry', 'Your card has expired'); ok = false; } }
      if (!/^\d{3}$/.test(v('cvv'))){ setError('cvv', 'CVV must be 3 digits'); ok = false; }
    }
    if (!ok){
      err.textContent = 'Please correct the highlighted fields.'; err.classList.remove('hidden');
      const first = $('.invalid', form); if (first) first.focus();
      return;
    }
    const body = {
      deliveryMethod: delivery(),
      paymentMethod: payment(),
      shippingAddress: {fullName: v('fullName'), address: v('address'), city: v('city'), zip: v('zip'), country: v('country'), phone: v('phone')},
      card: payment() === 'card' ? {number: v('cardNumber'), expiry: v('expiry'), cvv: v('cvv')} : null
    };
    const btn = $('#placeOrder');
    btn.disabled = true; btn.innerHTML = '<span class="spin-sm" data-testid="order-spinner"></span> Processing payment…';
    let order;
    try { order = await withMinDelay(api('POST', '/api/orders', body), DELAY.order); }
    catch (e2){
      if (!document.body.contains(btn)) return;
      btn.disabled = false; btn.textContent = 'Place your order';
      // 400 with fieldErrors -> under the fields; 402 declined card, 409 stock -> message at the top
      err.textContent = showFieldErrors(e2, CHECKOUT_FIELDS) ? 'Please correct the highlighted fields.' : e2.message;
      err.classList.remove('hidden');
      window.scrollTo(0, 0);
      return;
    }
    await refreshCart();                    // the server emptied the cart
    loadProducts().catch(() => {});         // stock changed; refresh the local copy in the background
    navigate('#/order/' + order.orderNumber);
  });
}

/* =========================================================
   GLOBAL EVENTS
   ========================================================= */
/** Runs a cart change, then redraws the cart page and the header. Errors become a toast. */
async function cartAction(fn, successMessage){
  try { await fn(); }
  catch (e){ showError(e); return false; }
  if (successMessage) toast(successMessage);
  updateHeader();
  if (document.body.dataset.page === 'cart') renderCart();
  return true;
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = Number(el.dataset.id);
  switch (el.dataset.action){
    case 'add': addToCart(id, 1); break;
    case 'add-qty': addToCart(id, Number($('#qtySelect').value)); break;
    case 'buy-now': if (await addToCart(id, Number($('#qtySelect').value))) navigate('#/checkout'); break;
    case 'toggle-wish': toggleWish(id); break;
    case 'remove':
      if (await confirmModal('Remove this item from your cart?', {ok: 'Remove'})){
        cartAction(() => removeFromCart(id), 'Item removed from cart');
      }
      break;
    case 'save-for-later':
      cartAction(async () => {
        await removeFromCart(id);
        if (!S.wishlist.includes(id)){ S.wishlist.push(id); persist(); }
      }, 'Moved to wishlist');
      break;
    case 'clear-cart':
      if (await confirmModal('Remove all items from your cart?', {ok: 'Remove all'})) cartAction(clearCart);
      break;
    case 'remove-promo': cartAction(removePromo); break;
    case 'logout':
      try { await api('POST', '/api/auth/logout'); } catch (err){ /* token may already be invalid: log out anyway */ }
      clearSession(); toast('You have been signed out'); navigate('#/');
      break;
    case 'clear-filters': navigate('#/'); break;
    case 'tab':
      $$('.tablist button').forEach(b => b.classList.toggle('active', b === el));
      $$('.tabpanel').forEach(p => p.classList.toggle('hidden', p.id !== 'tab-' + el.dataset.tab));
      break;
    case 'toggle-password': {
      const inp = document.getElementById(el.dataset.target);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; el.textContent = show ? 'Hide' : 'Show';
      break;
    }
    case 'move-to-cart':
      if (await addToCart(id, 1)){ S.wishlist = S.wishlist.filter(x => x !== id); persist(); renderWishlist(); updateHeader(); }
      break;
    case 'remove-wish': S.wishlist = S.wishlist.filter(x => x !== id); persist(); renderWishlist(); updateHeader(); break;
    case 'cancel-order': {
      const number = el.dataset.order;
      if (await confirmModal(`Cancel order ${number}?`, {title: 'Cancel order', ok: 'Yes, cancel'})){
        try { await api('POST', `/api/orders/${encodeURIComponent(number)}/cancel`); }
        catch (err){ showError(err); break; }
        toast(`Order ${number} has been cancelled`);
        loadProducts().catch(() => {});   // the items went back into stock
        renderOrders();
      }
      break;
    }
    case 'reset-data':
      if (await confirmModal('This clears cart, wishlist, users, orders and reviews.', {title: 'Reset store data?', ok: 'Reset'})){
        // 1) the database (POST /api/test/reset), 2) what this browser remembers
        try { await api('POST', '/api/test/reset'); }
        catch (err){ showError(err); break; }
        try { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)); } catch(err){}
        Object.assign(S, {token: null, user: null, cartView: null, guestCart: [], guestPromo: null, wishlist: [], reviews: {}});
        await loadProducts().catch(() => {});
        toast('Store data has been reset'); navigate('#/');
      }
      break;
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'qty'){
    const id = Number(e.target.dataset.id), qty = Number(e.target.value);
    cartAction(() => setQuantity(id, qty));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) $('#modalCancel').click(); });

/* =========================================================
   START
   ========================================================= */
async function start(){
  app.innerHTML = LOADING;
  try {
    await Promise.all([loadCategories(), loadProducts()]);
  } catch (e){
    // Without the API the shop can't work: show a clear message instead of an empty page.
    app.innerHTML = `<div class="panel empty" data-testid="api-unavailable"><div class="big">🔌</div>
      <h1>The shop is not available</h1><p class="muted" data-testid="api-unavailable-message">${esc(e.message)}</p>
      <button class="btn" onclick="location.reload()" data-testid="retry">Try again</button></div>`;
    return;
  }
  initHeader();
  if (S.token){
    // Still logged in from last time? Ask the server who the token belongs to.
    try { S.user = await api('GET', '/api/users/me', undefined, {redirectOn401: false}); }
    catch (e){ S.token = null; persist(); }
  }
  try { await refreshCart(); } catch (e){ /* the header just shows 0 */ }
  window.addEventListener('hashchange', router);
  router();
}
start();
</script>
